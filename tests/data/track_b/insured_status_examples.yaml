source_findings:
  poms_345_impossible_1975_interval:
    source: poms_rs_00301_345
    quote: $14,100 in a TY beginning after 1975 and before 1975
    finding: Empty interval as printed; the preceding wage table lists $14,100 for
      1975. Calendar-year wage maximum uses that table. No fiscal-year interpretation
      is silently inferred.
  poms_102_conflicting_issue_dates:
    source: poms_rs_00301_102
    quotes:
    - 5/12/04
    - 5/14/04
    finding: Example 4 names two SSN issuance dates; both after the statutory threshold.
      Alien adjudication is refused.
  poms_340_possible_unstated_ceiling:
    source: poms_rs_00301_345
    quote: $10,800 in a TY beginning after 1972 and before 1974;
    finding: This ceiling could explain the short-taxable-year example in RS00301.340:10800/3=3600,
      if printed10900 meant net earnings before the ceiling rather than already-covered
      SEI. The capture does not state the cap step; both readings stay explicit.
