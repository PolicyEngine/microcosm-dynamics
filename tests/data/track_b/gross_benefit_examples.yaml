invented_only_classes:
  cola_path:
    reason: The captures state the COLA ordering, but no in-scope numerical gross-family
      COLA path is published.
    tests:
    - tests/test_track_b_gross_benefits.py::test_record_state_applies_the_same_colas_to_pia_and_maximum
  dual:all_dual:
    reason: RS 00615.768 states that all-dual families disregard redistribution without
      publishing numerical figures.
    tests:
    - tests/test_track_b_gross_benefits.py::test_poms_768_all_dually_entitled_disregards_the_rule
  dual:parent:
    reason: RS 00209.015 states own-RIB/DIB offsets but gives no worked-money example.
    tests:
    - tests/test_track_b_gross_benefits_parents_ieds.py::test_parent_hand_reference_dib_retains_technical_entitlement
  dwb:
    reason: The DWB capture states 28.5% and the January 1984 recalculation without
      worked monetary figures.
    tests:
    - tests/test_track_b_gross_benefits_dwb.py::test_dwb_hand_reference_reduces_the_maximum_share
  ieds:
    reason: RS 00202.100 states IEDS entitlement and formula but gives no worked
      monetary example.
    tests:
    - tests/test_track_b_gross_benefits_parents_ieds.py::test_ieds_hand_reference_dual_entitlement_uses_the_spouse_method
  maximum:disability_aime:
    reason: The captured disability examples do not have the 85%-AIME branch binding.
    tests:
    - tests/test_track_b_gross_benefits.py::test_disability_family_maximum
  maximum:disability_floor:
    reason: The Bulletin publishes the disability cap case; floor cases are invented
      exact 403(a)(6) references.
    tests:
    - tests/test_track_b_gross_benefits.py::test_disabled_worker_family_can_leave_nothing_for_auxiliaries
  outside:divorced_spouse:
    reason: The captures give the outside-maximum rule without a monetary living-worker
      divorce example.
    tests:
    - tests/test_track_b_gross_benefits.py::test_divorced_spouse_is_ignored_by_everyone_else
  outside:ieds:
    reason: RS 00202.100 has no monetary IEDS worked example.
    tests:
    - tests/test_track_b_gross_benefits_parents_ieds.py::test_ieds_is_outside_the_maximum_and_other_divorced_spouses
  parent:one:
    reason: RS 00209.015 gives the 82.5% rule without a monetary parent example.
    tests:
    - tests/test_track_b_gross_benefits_parents_ieds.py::test_parent_hand_reference_one_or_two_entitled_parents
  parent:two:
    reason: RS 00209.015 gives the 75%-each rule without a monetary parent example.
    tests:
    - tests/test_track_b_gross_benefits_parents_ieds.py::test_parent_hand_reference_one_or_two_entitled_parents
  role:disabled_widow:
    reason: RS 00615.310/.315 provide rules without a numerical DWB example.
    tests:
    - tests/test_track_b_gross_benefits_dwb.py::test_dwb_hand_reference_and_round_up
  role:divorced_spouse:
    reason: The captured divorced-spouse sections give entitlement and payment rules
      without a worked-money life example.
    tests:
    - tests/test_track_b_gross_benefits.py::test_divorced_spouse_is_ignored_by_everyone_else
  role:parent:
    reason: RS 00209.001/.015 provide rules without a numerical example.
    tests:
    - tests/test_track_b_gross_benefits_parents_ieds.py::test_parent_hand_reference_one_or_two_entitled_parents
  role:spouse_child_in_care:
    reason: The captures give the exemption from age reduction but no worked-money
      child-in-care dual-entitlement example.
    tests:
    - tests/test_track_b_gross_benefits.py::test_child_in_care_spouse_offset_uses_the_reduced_rib
  ssfa:gpo_ignored:
    reason: GN 02608.100 publishes the repeal boundary, not worked gross-family monetary
      figures.
    tests:
    - tests/test_track_b_gross_benefits_ssfa.py::test_gpo_refuses_december_2023_and_computes_january_2024
  ssfa:wep_regular_pia:
    reason: 'RS 00605.360 publishes WEP repeal from January 2024 without a gross-family
      monetary example. G takes the PIA as an input: a WEP-affected PIA is supplied
      by the caller before 2024, and a regular-formula PIA is supplied from January
      2024.'
    tests:
    - tests/test_track_b_gross_benefits_ssfa.py::test_wep_pia_is_supplied_by_caller_and_regular_pia_applies_after_repeal
    - tests/test_track_b_gross_benefits_parents_ieds.py::test_ieds_worker_wep_december_2023_january_2024_boundary
examples:
- id: rs-00615-756-seven-children
  capture_id: poms_rs_00615_756
  section: B.3
  tags:
  - record:survivor
  - role:widow
  - role:child
  - maximum:binding
  inputs:
    scenarios:
      case:
        operation: family
        state:
          kind: survivor
          pia: '492.90'
          family_maximum: '862.60'
          # RS 00615.756B.3: "WIB DRCs Not Involved".
          widow_drc_savings_clause: false
        members:
        - beneficiary_id: D
          role: widow
          child_in_care: false
        - beneficiary_id: C0
          role: child
        - beneficiary_id: C1
          role: child
        - beneficiary_id: C2
          role: child
        - beneficiary_id: C3
          role: child
        - beneficiary_id: C4
          role: child
        - beneficiary_id: C5
          role: child
        - beneficiary_id: C6
          role: child
  figure_count: 12
  expected:
  - path: case.state.pia
    value: '492.90'
    literal: $492.90
  - path: case.state.family_maximum
    value: '862.60'
    literal: $862.60
  - path: case.rows.C0.original_benefit
    value: '369.60'
    literal: $369.60
  - path: case.result.total_original_benefits
    value: '3080.10'
    literal: $3080.10
  - path: case.rows.D.auxiliary_payable
    value: '138.00'
    literal: $138.00
  - path: case.rows.C0.auxiliary_payable
    value: '103.50'
    literal: $103.50 each
  - path: case.rows.C1.auxiliary_payable
    value: '103.50'
    literal: $103.50 each
  - path: case.rows.C2.auxiliary_payable
    value: '103.50'
    literal: $103.50 each
  - path: case.rows.C3.auxiliary_payable
    value: '103.50'
    literal: $103.50 each
  - path: case.rows.C4.auxiliary_payable
    value: '103.50'
    literal: $103.50 each
  - path: case.rows.C5.auxiliary_payable
    value: '103.50'
    literal: $103.50 each
  - path: case.rows.C6.auxiliary_payable
    value: '103.50'
    literal: $103.50 each
  derived_expected:
  - path: case.rows.D.whole_dollar_auxiliary
    value: '138'
    derivation: '215(g): floor 138.00'
  - path: case.result.record_total
    value: '862.50'
    derivation: 138.00 + 7 * 103.50
  - path: case.result.record_total_whole_dollars
    value: '859'
    derivation: '215(g): 138 + 7 * 103'
