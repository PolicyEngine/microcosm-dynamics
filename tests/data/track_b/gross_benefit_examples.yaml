- id: rs-00615-682-divorced-widow
  capture_id: poms_rs_00615_682
  section: Example
  tags:
  - record:survivor
  - role:mother_father
  - role:child
  - role:surviving_divorced_spouse
  - reduction:widow
  - maximum:binding
  - maximum:nonbinding
  - outside:surviving_divorced_spouse
  inputs:
    scenarios:
      before:
        operation: family
        state:
          kind: survivor
          pia: '203.90'
          family_maximum: '305.90'
          # RS 00615.682: mother and children, without a DRC-increased widow.
          widow_drc_savings_clause: false
        members:
        - beneficiary_id: E1
          role: mother_father
        - &id001
          beneficiary_id: C1
          role: child
        - &id002
          beneficiary_id: C2
          role: child
      after:
        operation: family
        state:
          kind: survivor
          pia: '203.90'
          family_maximum: '305.90'
          # RS 00615.682: the divorced widow is outside the family maximum.
          widow_drc_savings_clause: false
        members:
        - beneficiary_id: D6
          role: surviving_divorced_spouse
          child_in_care: false
          reduction_months: 60
          reduction_period_months: 60
        - *id001
        - *id002
  figure_count: 8
  expected:
  - path: before.state.pia
    value: '203.90'
    literal: $203.90
  - path: before.state.family_maximum
    value: '305.90'
    literal: $305.90
  - path: before.rows.E1.auxiliary_payable
    value: '101.90'
    literal: $101.90 each
  - path: before.rows.C1.auxiliary_payable
    value: '101.90'
    literal: $101.90 each
  - path: before.rows.C2.auxiliary_payable
    value: '101.90'
    literal: $101.90 each
  - path: after.rows.D6.auxiliary_payable
    value: '145.70'
    literal: $145.70
  - path: after.rows.C1.auxiliary_payable
    value: '152.90'
    literal: $152.90 to each child
  - path: after.rows.C2.auxiliary_payable
    value: '152.90'
    literal: $152.90 to each child
  derived_expected:
  - path: after.result.record_total_whole_dollars
    value: '449'
    derivation: '215(g): 145 + 152 + 152'
