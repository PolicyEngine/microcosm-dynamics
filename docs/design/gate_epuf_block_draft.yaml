    faithful_candidate_oc_of_selected_cells:
      analytic_product: 0.998599
      empirical_joint: 1.0
    bite_requirements:
      persistence:
        bite: bd1_persistence_loss_0.10
        required_fail_share: 0.9
        fail_share: 0.44
        met: false
    ceremony_pause: true
    referee_round_1:
      report: reviews/gate_epuf_round1_referee_20261002.md
      reviewer: independent Opus 5.5 lane (subfleet job 20261002-095515-epuf-gate-r1b),
        reviewing head ce8d5000
      verdict: 'AMEND: do not lock as registered'
      ruling: 'Not locked. The registered persistence bite could not be met by design:
        the tolerance is about 3.2 realised sigmas (0.079) while giving 10 percent
        of persons a donor''s early years shifts the 1998-2004 rank correlation by
        about 0.07, so the pause was an internal inconsistency of the registration,
        not a data surprise. The two cells the rules selected add no demonstrated
        catch beyond gate 1, and with the bridge signs public the registered candidate''s
        verdict is largely predictable. Relaxing the bite requirement after seeing
        the result (option (a)) is rejected; the cells publish report-only with every
        gate-1 run. A gate with bite needs a fresh registration (proposal section
        12).'
    lock_ceremony:
      exists: false
      stage: closed without lock (referee round 1)
      required_for_any_future_lock: a fresh registration with a new id, its rules
        fixed before anything is recomputed (proposal section 12)
