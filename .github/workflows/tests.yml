name: Tests

on:
  push:
    branches:
      - master
  pull_request:

# A new push to a pull request cancels that pull request's older unfinished
# run (each run holds up to 7 org-shared runners for ~100 runner-minutes).
# Every master push gets its own group (run_id), so merges are never
# cancelled and each one is validated independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-shard:
    runs-on: ubuntu-latest
    # The slowest shard took 49-73 min on 2026-10-06..08 (shard 2/4; the
    # committed .test_durations predates half the suite). The cap frees a
    # hung shard's runner after 2 h instead of GitHub's 6 h default.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        shard: [1, 2, 3, 4]
    name: pytest-shard (${{ matrix.python-version }}, ${{ matrix.shard }}/4)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The birth-evidence identity guard resolves historical
          # commits; a shallow clone cannot.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package
        run: pip install -e ".[dev]" pytest-split

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: pytest -q --splits 4 --group ${{ matrix.shard }} --splitting-algorithm duration_based_chunks --durations-path .test_durations

  graph-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install the pinned optional graph integration
        run: pip install -e ".[graph]" pytest
      - name: Require typed graph capabilities
        run: python -c "from populace_dynamics.graph._compat import require_graph; require_graph()"
      - name: Run graph and existing mortality regressions
        run: pytest -q tests/test_graph_mortality.py tests/test_graph_mortality_trajectory.py tests/test_graph_trajectory_accounting.py tests/test_m6_engine_refit.py tests/test_m6_engine_steps.py

  # Fan-in jobs keeping the branch-protection context names
  # ("pytest (3.11)" / "pytest (3.13)") stable across the shard split.
  pytest:
    name: pytest (${{ matrix.python-version }})
    needs: [pytest-shard, graph-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - name: Verify all shards passed
        run: |
          test "${{ needs.pytest-shard.result }}" = "success"
          test "${{ needs.graph-integration.result }}" = "success"
